<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم المهام والجدول اليومي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --prio-high: #ef4444;
            --prio-med: #f59e0b;
            --prio-low: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            margin-top: 10px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        header .title-box h1 { font-size: 1.5rem; }
        header .title-box p { color: var(--text-muted); font-size: 0.8rem; }

        .btn-calendar {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-calendar:hover { border-color: var(--accent-color); color: var(--accent-color); }

        /* شريط تقدم الإنجاز */
        .progress-box {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 20px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #22c55e);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* أزرار أيام الأسبوع */
        .day-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .day-btn {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .day-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            font-weight: bold;
        }

        /* نموذج إضافة المهمة */
        .add-task-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            background: #0f172a50;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .form-row { display: flex; gap: 8px; flex-wrap: wrap; }

        input[type="text"] {
            flex: 1;
            min-width: 180px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        select, input[type="time"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        .btn-add {
            padding: 10px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add:hover { background-color: var(--accent-hover); }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filters { display: flex; gap: 5px; }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .filter-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .btn-clear-done {
            background: transparent;
            border: none;
            color: var(--danger-color);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        /* القائمة */
        .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a80;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .task-item.completed { opacity: 0.5; }
        .task-item.completed .task-text { text-decoration: line-through; }

        .task-content { display: flex; align-items: center; gap: 10px; flex: 1; }
        .checkbox { width: 18px; height: 18px; accent-color: var(--accent-color); cursor: pointer; }
        .task-info { display: flex; flex-direction: column; gap: 2px; }
        .task-text { font-size: 0.95rem; font-weight: 600; }
        .task-details { font-size: 0.75rem; color: var(--text-muted); }

        .badge-group { display: flex; gap: 4px; align-items: center; }
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; }
        .badge-lectures { background: #3b82f620; color: #60a5fa; border: 1px solid #3b82f640; }
        .badge-study { background: #8b5cf620; color: #c084fc; border: 1px solid #8b5cf640; }
        .badge-language { background: #f59e0b20; color: #fbbf24; border: 1px solid #f59e0b40; }
        .badge-general { background: #64748b20; color: #cbd5e1; border: 1px solid #64748b40; }

        .prio-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 6px; font-weight: bold; }
        .prio-high { background: #ef444420; color: var(--prio-high); border: 1px solid #ef444440; }
        .prio-med { background: #f59e0b20; color: var(--prio-med); border: 1px solid #f59e0b40; }
        .prio-low { background: #10b98120; color: var(--prio-low); border: 1px solid #10b98140; }

        .btn-delete { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; }
        .btn-delete:hover { color: var(--danger-color); }

        .empty-state { text-align: center; padding: 25px; color: var(--text-muted); font-size: 0.9rem; }
        
        .tools-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            gap: 10px;
        }

        .footer-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .footer-btn:hover { border-color: var(--accent-color); color: var(--text-main); }

        /* نافذة التقويم Popup Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            backdrop-filter: blur(4px);
        }
        .modal.active { display: flex; }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .cal-header h3 { font-size: 1.1rem; }

        .cal-nav-btn {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .cal-grid-head {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .cal-grid-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .cal-cell {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            min-height: 44px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .cal-cell:hover { border-color: var(--accent-color); background: #1e293b; }
        .cal-cell.today { border-color: var(--accent-color); font-weight: bold; color: var(--accent-color); }
        .cal-cell .dot {
            width: 5px;
            height: 5px;
            background: var(--success-color);
            border-radius: 50%;
            margin-top: 2px;
        }

        .close-modal-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="title-box">
                <h1>📌 جدول المهام اليومي</h1>
                <p>تنظيم المحاضرات، المذاكرة، والمهام</p>
            </div>
            <button class="btn-calendar" onclick="openCalendar()">📅 التقويم</button>
        </header>

        <!-- شريط التقدم اليومي -->
        <div class="progress-box">
            <div class="progress-header">
                <span>نسبة الإنجاز اليومي</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- أزرار أيام الأسبوع -->
        <div class="day-selector" id="daySelector">
            <button class="day-btn active" onclick="selectDay('Saturday', this)">السبت</button>
            <button class="day-btn" onclick="selectDay('Sunday', this)">الأحد</button>
            <button class="day-btn" onclick="selectDay('Monday', this)">الإثنين</button>
            <button class="day-btn" onclick="selectDay('Tuesday', this)">الثلاثاء</button>
            <button class="day-btn" onclick="selectDay('Wednesday', this)">الأربعاء</button>
            <button class="day-btn" onclick="selectDay('Thursday', this)">الخميس</button>
            <button class="day-btn" onclick="selectDay('Friday', this)">الجمعة</button>
        </div>

        <!-- إضافة مهمة/محاضرة -->
        <div class="add-task-form">
            <div class="form-row">
                <input type="text" id="taskInput" placeholder="اكتب المهمة أو المحاضرة..." />
                <select id="categorySelect">
                    <option value="lectures">🏛️ محاضرة</option>
                    <option value="study">💻 مذاكرة</option>
                    <option value="language">🌐 لغات</option>
                    <option value="general">📝 عام</option>
                </select>
                <select id="prioritySelect">
                    <option value="high">🔥 أولوية عالية</option>
                    <option value="med" selected>⚡ أولوية متوسطة</option>
                    <option value="low">☕ أولوية منخفضة</option>
                </select>
            </div>
            
            <div class="form-row">
                <input type="time" id="startTimeInput" value="09:00" />
                <input type="time" id="endTimeInput" value="10:00" />
                <input type="text" id="roomInput" placeholder="المكان / ملاحظات (اختياري)" style="flex: 1;" />
                <button class="btn-add" onclick="addTask()">➕ إضافة اليوم</button>
            </div>
        </div>

        <!-- التصفية وأزرار المسح -->
        <div class="controls">
            <div class="filters">
                <button class="filter-btn active" onclick="filterTasks('all', this)">الكل</button>
                <button class="filter-btn" onclick="filterTasks('pending', this)">المتبقية</button>
                <button class="filter-btn" onclick="filterTasks('completed', this)">المكتملة</button>
            </div>
            <button class="btn-clear-done" onclick="clearCompleted()">🗑️ مسح المكتمل</button>
        </div>

        <!-- قائمة المهام -->
        <ul class="task-list" id="taskList"></ul>

        <!-- خيارات النسخ الاحتياطي -->
        <div class="tools-footer">
            <button class="footer-btn" onclick="exportData()">💾 تصدير نسخة احتياطية</button>
            <button class="footer-btn" onclick="document.getElementById('importFile').click()">📂 استرجاع البيانات</button>
            <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)">
        </div>
    </div>

    <!-- نافذة التقويم الشهري -->
    <div class="modal" id="calendarModal">
        <div class="modal-content">
            <div class="cal-header">
                <div>
                    <button class="cal-nav-btn" onclick="changeMonth(-1)">▶</button>
                    <button class="cal-nav-btn" onclick="changeMonth(1)">◀</button>
                </div>
                <h3 id="calMonthYear">سبتمبر 2026</h3>
                <button class="close-modal-btn" onclick="closeCalendar()">✖</button>
            </div>

            <div class="cal-grid-head">
                <div>سبت</div>
                <div>أحد</div>
                <div>إثنين</div>
                <div>ثلاثاء</div>
                <div>أربعاء</div>
                <div>خميس</div>
                <div>جمعة</div>
            </div>

            <div class="cal-grid-days" id="calGridDays"></div>
        </div>
    </div>

    <script>
        const emptySchedule = {
            Saturday: [], Sunday: [], Monday: [], Tuesday: [], Wednesday: [], Thursday: [], Friday: []
        };

        const dayKeys = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const monthNamesAr = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

        let currentDay = 'Saturday';
        let currentFilter = 'all';
        let calDate = new Date();
        let scheduleData = JSON.parse(localStorage.getItem('my_clean_tasks_db')) || emptySchedule;

        function saveSchedule() {
            localStorage.setItem('my_clean_tasks_db', JSON.stringify(scheduleData));
            renderTasks();
        }

        function selectDay(day, btn) {
            currentDay = day;
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderTasks();
        }

        function addTask() {
            const text = document.getElementById('taskInput').value.trim();
            if (!text) return;

            const newTask = {
                id: Date.now(),
                text: text,
                category: document.getElementById('categorySelect').value,
                priority: document.getElementById('prioritySelect').value,
                startTime: document.getElementById('startTimeInput').value,
                endTime: document.getElementById('endTimeInput').value,
                room: document.getElementById('roomInput').value.trim(),
                completed: false
            };

            if (!scheduleData[currentDay]) scheduleData[currentDay] = [];
            scheduleData[currentDay].push(newTask);
            
            document.getElementById('taskInput').value = '';
            document.getElementById('roomInput').value = '';
            saveSchedule();
        }

        function deleteTask(id) {
            scheduleData[currentDay] = scheduleData[currentDay].filter(t => t.id !== id);
            saveSchedule();
        }

        function toggleTask(id) {
            scheduleData[currentDay] = scheduleData[currentDay].map(t => {
                if (t.id === id) return { ...t, completed: !t.completed };
                return t;
            });
            saveSchedule();
        }

        function clearCompleted() {
            if (confirm('هل تريد حذف جميع المهام المكتملة لليوم المحدد؟')) {
                scheduleData[currentDay] = (scheduleData[currentDay] || []).filter(t => !t.completed);
                saveSchedule();
            }
        }

        function filterTasks(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTasks();
        }

        function getCategoryBadge(category) {
            switch(category) {
                case 'lectures': return '<span class="badge badge-lectures">محاضرات</span>';
                case 'study': return '<span class="badge badge-study">مذاكرة</span>';
                case 'language': return '<span class="badge badge-language">لغة</span>';
                default: return '<span class="badge badge-general">عام</span>';
            }
        }

        function getPriorityBadge(priority) {
            switch(priority) {
                case 'high': return '<span class="prio-badge prio-high">🔥 عالية</span>';
                case 'med': return '<span class="prio-badge prio-med">⚡ متوسطة</span>';
                case 'low': return '<span class="prio-badge prio-low">☕ منخفضة</span>';
                default: return '';
            }
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            const dayTasks = scheduleData[currentDay] || [];

            const total = dayTasks.length;
            const completedCount = dayTasks.filter(t => t.completed).length;
            const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);

            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressText').innerText = `${percent}% (${completedCount}/${total})`;

            let filtered = dayTasks.filter(t => {
                if (currentFilter === 'pending') return !t.completed;
                if (currentFilter === 'completed') return t.completed;
                return true;
            });

            if (filtered.length === 0) {
                taskList.innerHTML = `<div class="empty-state">🎉 لا توجد مهام مسجلة لهذا اليوم</div>`;
            } else {
                filtered.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;
                    const detailsStr = task.room ? `⏰ ${task.startTime} - ${task.endTime} | 📍 ${task.room}` : `⏰ ${task.startTime} - ${task.endTime}`;
                    
                    li.innerHTML = `
                        <div class="task-content">
                            <input type="checkbox" class="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                            <div class="task-info">
                                <span class="task-text">${task.text}</span>
                                <span class="task-details">${detailsStr}</span>
                            </div>
                            <div class="badge-group">
                                ${getPriorityBadge(task.priority)}
                                ${getCategoryBadge(task.category)}
                            </div>
                        </div>
                        <button class="btn-delete" onclick="deleteTask(${task.id})" title="حذف">🗑️</button>
                    `;
                    taskList.appendChild(li);
                });
            }
        }

        /* ووظائف التقويم Modal */
        function openCalendar() {
            document.getElementById('calendarModal').classList.add('active');
            renderCalendar();
        }

        function closeCalendar() {
            document.getElementById('calendarModal').classList.remove('active');
        }

        function changeMonth(delta) {
            calDate.setMonth(calDate.getMonth() + delta);
            renderCalendar();
        }

        function renderCalendar() {
            const year = calDate.getFullYear();
            const month = calDate.getMonth();

            document.getElementById('calMonthYear').innerText = `${monthNamesAr[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('calGridDays');
            grid.innerHTML = '';

            let offset = (firstDay + 1) % 7; // ضبط البداية ليوم السبت

            for (let i = 0; i < offset; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'cal-cell';
                emptyCell.style.visibility = 'hidden';
                grid.appendChild(emptyCell);
            }

            const today = new Date();

            for (let d = 1; d <= daysInMonth; d++) {
                const cellDate = new Date(year, month, d);
                const dayOfWeekIndex = cellDate.getDay();
                const dayName = dayKeys[dayOfWeekIndex];

                const cell = document.createElement('div');
                cell.className = 'cal-cell';
                if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    cell.classList.add('today');
                }

                cell.innerHTML = `<span>${d}</span>`;

                if (scheduleData[dayName] && scheduleData[dayName].length > 0) {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    cell.appendChild(dot);
                }

                cell.onclick = function() {
                    const btns = document.querySelectorAll('.day-btn');
                    let targetBtn = null;
                    btns.forEach(b => {
                        if (b.getAttribute('onclick').includes(`'${dayName}'`)) {
                            targetBtn = b;
                        }
                    });
                    selectDay(dayName, targetBtn);
                    closeCalendar();
                };

                grid.appendChild(cell);
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(scheduleData));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `my_schedule_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const importedObj = JSON.parse(evt.target.result);
                    if (importedObj && typeof importedObj === 'object') {
                        scheduleData = importedObj;
                        saveSchedule();
                        alert('تم استرجاع البيانات بنجاح!');
                    }
                } catch (err) {
                    alert('ملف غير صالح!');
                }
            };
            reader.readAsText(file);
        }

        renderTasks();
    </script>
