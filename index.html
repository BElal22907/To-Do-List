<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول المهام والمحاضرات اليومي</title>
    <!-- خط القاهرة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة Tesseract لقراءة الصور (OCR) ومكتبة PDF.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            margin-top: 10px;
        }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.6rem; margin-bottom: 5px; }
        header p { color: var(--text-muted); font-size: 0.9rem; }

        /* شريط التقويم والتاريخ */
        .calendar-bar {
            background: #0f172a;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .date-picker-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="date"], input[type="time"] {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        /* نموذج إضافة مهمة */
        .add-task-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            background: #0f172a50;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .form-row { display: flex; gap: 8px; flex-wrap: wrap; }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        .time-label { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }

        .btn-add {
            padding: 10px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add:hover { background-color: var(--accent-hover); }

        /* رفع الملفات والجدول */
        .file-upload-box {
            background: #1e293b;
            border: 2px dashed var(--border-color);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .file-upload-box:hover { border-color: var(--accent-color); }
        .file-upload-box input { display: none; }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            gap: 10px;
        }

        .filters { display: flex; gap: 5px; }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .filter-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a80;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .task-item.completed { opacity: 0.5; }
        .task-item.completed .task-text { text-decoration: line-through; }

        .task-content { display: flex; align-items: center; gap: 10px; flex: 1; }
        .checkbox { width: 18px; height: 18px; accent-color: var(--accent-color); cursor: pointer; }
        .task-info { display: flex; flex-direction: column; gap: 2px; }
        .task-text { font-size: 0.95rem; font-weight: 600; }
        .task-time-range { font-size: 0.75rem; color: var(--text-muted); }

        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; }
        .badge-lectures { background: #3b82f620; color: #60a5fa; border: 1px solid #3b82f640; }
        .badge-study { background: #8b5cf620; color: #c084fc; border: 1px solid #8b5cf640; }
        .badge-german { background: #f59e0b20; color: #fbbf24; border: 1px solid #f59e0b40; }
        .badge-general { background: #64748b20; color: #cbd5e1; border: 1px solid #64748b40; }

        .btn-delete { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; }
        .btn-delete:hover { color: var(--danger-color); }

        .empty-state { text-align: center; padding: 25px; color: var(--text-muted); font-size: 0.9rem; }
        
        /* Modal لقراءة النص */
        .loading-spinner {
            display: none;
            color: var(--accent-color);
            font-size: 0.85rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📅 جدول المحاضرات والمهام</h1>
            <p>متابعة يومية، تقويم، وتحويل الصور إلى جدول مهام</p>
        </header>

        <!-- شريط التقويم وتحديد اليوم -->
        <div class="calendar-bar">
            <div class="date-picker-group">
                <label for="currentViewDate" style="font-size: 0.85rem;">عرض مهام يوم:</label>
                <input type="date" id="currentViewDate" onchange="renderTasks()">
            </div>
            <button class="filter-btn active" onclick="setToday()">اليوم</button>
        </div>

        <!-- رفع ملف أو صورة جدول -->
        <div class="file-upload-box" onclick="document.getElementById('fileInput').click()">
            <p>📷 <strong>اضغط هنا لرفع صورة جدول أو ملف PDF</strong></p>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">سيتم قراءة المحاضرات واستخراجها تلقائياً</p>
            <input type="file" id="fileInput" accept="image/*,.pdf" onchange="processScheduleFile(event)">
            <div id="loadingStatus" class="loading-spinner">⏳ جاري قراءة المستند واستخراج المحاضرات...</div>
        </div>

        <!-- نموذج إضافة مهمة -->
        <div class="add-task-form">
            <div class="form-row">
                <input type="text" id="taskInput" placeholder="عنوان المهمة / المحاضرة..." />
                <select id="categorySelect">
                    <option value="lectures">🏛️ محاضرة</option>
                    <option value="study">💻 مذاكرة</option>
                    <option value="german">🇩🇪 ألماني</option>
                    <option value="general">📝 عام</option>
                </select>
            </div>
            
            <div class="form-row">
                <div class="time-label">
                    <span>من:</span>
                    <input type="date" id="startDateInput" />
                </div>
                <div class="time-label">
                    <span>إلى:</span>
                    <input type="date" id="endDateInput" />
                </div>
            </div>

            <div class="form-row">
                <div class="time-label">
                    <span>وقت البداية:</span>
                    <input type="time" id="startTimeInput" value="09:00" />
                </div>
                <div class="time-label">
                    <span>وقت النهاية:</span>
                    <input type="time" id="endTimeInput" value="11:00" />
                </div>
            </div>

            <button class="btn-add" onclick="addTask()">➕ إضافة لجدول الأيام المحددة</button>
        </div>

        <!-- التصفية -->
        <div class="controls">
            <div class="filters">
                <button class="filter-btn active" onclick="filterTasks('all', this)">الكل</button>
                <button class="filter-btn" onclick="filterTasks('pending', this)">المتبقية</button>
                <button class="filter-btn" onclick="filterTasks('completed', this)">المكتملة</button>
            </div>
            <div class="task-stats" id="taskStats">0 مهام</div>
        </div>

        <!-- القائمة -->
        <ul class="task-list" id="taskList"></ul>
    </div>

    <script>
        // إعداد التاريخ الافتراضي
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('currentViewDate').value = todayStr;
        document.getElementById('startDateInput').value = todayStr;
        document.getElementById('endDateInput').value = todayStr;

        let tasks = JSON.parse(localStorage.getItem('my_calendar_tasks')) || [];
        let currentFilter = 'all';

        function setToday() {
            document.getElementById('currentViewDate').value = todayStr;
            renderTasks();
        }

        function saveTasks() {
            localStorage.setItem('my_calendar_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function addTask(customData = null) {
            let taskObj;
            if (customData) {
                taskObj = customData;
            } else {
                const text = document.getElementById('taskInput').value.trim();
                if (!text) return;

                taskObj = {
                    id: Date.now(),
                    text: text,
                    category: document.getElementById('categorySelect').value,
                    startDate: document.getElementById('startDateInput').value,
                    endDate: document.getElementById('endDateInput').value,
                    startTime: document.getElementById('startTimeInput').value,
                    endTime: document.getElementById('endTimeInput').value,
                    completedDates: []
                };
            }

            tasks.push(taskObj);
            document.getElementById('taskInput').value = '';
            saveTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
        }

        function toggleTask(id, dateStr) {
            tasks = tasks.map(t => {
                if (t.id === id) {
                    let completed = t.completedDates || [];
                    if (completed.includes(dateStr)) {
                        completed = completed.filter(d => d !== dateStr);
                    } else {
                        completed.push(dateStr);
                    }
                    return { ...t, completedDates: completed };
                }
                return t;
            });
            saveTasks();
        }

        function filterTasks(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTasks();
        }

        function getCategoryBadge(category) {
            switch(category) {
                case 'lectures': return '<span class="badge badge-lectures">محاضرات</span>';
                case 'study': return '<span class="badge badge-study">مذاكرة</span>';
                case 'german': return '<span class="badge badge-german">ألماني</span>';
                default: return '<span class="badge badge-general">عام</span>';
            }
        }

        function renderTasks() {
            const selectedDate = document.getElementById('currentViewDate').value;
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            // تصفية المهام التي تشمل التاريخ المحدد (بين بداية ونهاية المهمة)
            let dayTasks = tasks.filter(t => {
                return selectedDate >= t.startDate && selectedDate <= t.endDate;
            });

            // تطبيق فلتر (الكل / متبقي / مكتمل)
            let filtered = dayTasks.filter(t => {
                const isCompleted = (t.completedDates || []).includes(selectedDate);
                if (currentFilter === 'pending') return !isCompleted;
                if (currentFilter === 'completed') return isCompleted;
                return true;
            });

            if (filtered.length === 0) {
                taskList.innerHTML = `<div class="empty-state">🎉 لا توجد مهام مسجلة ليوم ${selectedDate}</div>`;
            } else {
                filtered.forEach(task => {
                    const isCompleted = (task.completedDates || []).includes(selectedDate);
                    const li = document.createElement('li');
                    li.className = `task-item ${isCompleted ? 'completed' : ''}`;
                    li.innerHTML = `
                        <div class="task-content">
                            <input type="checkbox" class="checkbox" ${isCompleted ? 'checked' : ''} onchange="toggleTask(${task.id}, '${selectedDate}')">
                            <div class="task-info">
                                <span class="task-text">${task.text}</span>
                                <span class="task-time-range">⏰ ${task.startTime} - ${task.endTime}</span>
                            </div>
                            ${getCategoryBadge(task.category)}
                        </div>
                        <button class="btn-delete" onclick="deleteTask(${task.id})" title="حذف">🗑️</button>
                    `;
                    taskList.appendChild(li);
                });
            }

            const pending = dayTasks.filter(t => !(t.completedDates || []).includes(selectedDate)).length;
            document.getElementById('taskStats').innerText = `${pending} مهام متبقية لهذا اليوم`;
        }

        // معالجة قراءة الصور وملفات الـ PDF للجدول
        async function processScheduleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const status = document.getElementById('loadingStatus');
            status.style.display = 'block';

            try {
                let extractedText = '';
                if (file.type.startsWith('image/')) {
                    // استخدام Tesseract لقراءة الصورة
                    const result = await Tesseract.recognize(file, 'ara+eng');
                    extractedText = result.data.text;
                } else if (file.type === 'application/pdf') {
                    // قراءة PDF
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        extractedText += textContent.items.map(item => item.str).join(' ') + '\n';
                    }
                }

                status.style.display = 'none';

                // تحليل الأسطر وتحويلها إلى مهام
                const lines = extractedText.split('\n').filter(l => l.trim().length > 2);
                if (lines.length > 0) {
                    let addedCount = 0;
                    lines.forEach((line, idx) => {
                        if (idx < 8) { // إضافة أول 8 أسطر واضحة كمهام محاضرات
                            addTask({
                                id: Date.now() + idx,
                                text: line.trim(),
                                category: 'lectures',
                                startDate: document.getElementById('currentViewDate').value,
                                endDate: document.getElementById('currentViewDate').value,
                                startTime: `${08 + (idx % 4)}:00`,
                                endTime: `${10 + (idx % 4)}:00`,
                                completedDates: []
                            });
                            addedCount++;
                        }
                    });
                    alert(`تم استخراج ${addedCount} محاضرة/مهمة من المستند بنجاح!`);
                } else {
                    alert('لم يتم العثور على نص واضح في الملف، يرجى كتابتها يدوياً.');
                }
            } catch (err) {
                console.error(err);
                status.style.display = 'none';
                alert('حدث خطأ أثناء قراءة الملف، تأكد من وضوح الصورة.');
            }
        }

        renderTasks();
    </script>
</body>
</html>
